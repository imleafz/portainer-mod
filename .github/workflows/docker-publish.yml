name: Build and Push Docker Image

on:
  push:
    tags:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.25.8'
  PNPM_VERSION: '10.26.2'
  ENV: production
  WEBPACK_CONFIG: webpack/webpack.production.js

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Tidy go.mod
        run: make tidy

      - name: Install server dependencies
        run: make server-deps

      - name: Install client dependencies
        run: make client-deps

      - name: Build server
        run: make build-server

      - name: Build client
        run: pnpm run build --config ${{ env.WEBPACK_CONFIG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: build/linux/Dockerfile
          build-args: |
            TAG=${{ github.ref_name }}
            PORTAINER_IMAGE_NAME=${{ env.IMAGE_NAME }}
          platforms: linux/amd64
